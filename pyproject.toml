[project]
name = "mowbot"
version = "0.1.0"
description = "Learn Python by programming a robotic lawnmower in the browser: the rules engine"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pillow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mowbot"]
